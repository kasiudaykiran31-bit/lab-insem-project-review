<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Program System</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
<div class="login-bg"><span></span><span></span><span></span></div>
<div class="login-card">
  <div class="logo-box">🎓</div>
  <h1>Student Program System</h1>
  <p class="sub">Student Information & Academic Management</p>
<form id="loginForm">
    <label>Email</label>
    <input id="email" type="email" placeholder="Enter email" required>
    <label>Password</label>
    <input id="password" type="password" placeholder="Enter password" required>
    <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin:-4px 0 12px;cursor:pointer"><input type="checkbox" style="width:auto" onchange="document.getElementById('password').type=this.checked?'text':'password'"> Show password</label>
    <button class="btn primary full" type="submit">Login <span>→</span></button>
  </form>
  <div id="loginMsg" class="msg"></div>
  <p class="register-link">New here? <a href="register.html">Create a student or parent account</a></p>
</div>
<script src="script.js"></script>
</body>
</html>
